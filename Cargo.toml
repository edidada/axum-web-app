[package]
name = "axum-web-app"
version = "0.1.0"
edition = "2021"

[features]
default = []
minio = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types"]

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "threadid_log"
path = "src/bin/threadid_log.rs"

[[bin]]
name = "log_app"
path = "src/bin/log_app.rs"

[[bin]]
name = "log_chinese"
path = "src/bin/log_chinese.rs"

[[bin]]
name = "rbatis_main"
path = "src/bin/rbatis/rbatis_main.rs"

[[bin]]
name = "rbatis_xml_main"
path = "src/bin/rbatis/rbatis_xml_main.rs"

[[bin]]
name = "rbatis_xml_main2"
path = "src/bin/rbatis/rbatis_xml_main2.rs"

[dependencies]
axum = "0.5"
tokio = { version = "1", features = ["full"] }
ammonia = "3.1"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
redis = { version = "0.32", features = ["tokio-comp"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
tower = "0.4.13"
tower-http = { version = "0.3", features = ["cors"] }
config = "0.11"
rbatis = "=4.7.2"
rbdc = "=4.7.0"
rbdc-mysql = "=4.7.1"
rbdc-sqlite = "=4.7.1"
rbdc-pg = "=4.7.1"
aws-sdk-s3 = { version = "=1.20.0", optional = true }
aws-config = { version = "=1.1.7", optional = true }
aws-credential-types = { version = "=1.1.8", optional = true }
generic-array = "=1.0.0"
once_cell = "1.19.0"
rbs = "=4.7.0"
rand = "0.8"
simplelog = "0.12"
log = "0.4"
hyper = "0.14"
jsonwebtoken = "9.3"

[dev-dependencies]
criterion = "0.5"
toml = "0.8"

[[bench]]
name = "rbatis_bench"
harness = false
