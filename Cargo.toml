[package]
name = "axum-web-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "threadid_log"
path = "src/bin/threadid_log.rs"

[[bin]]
name = "log_app"
path = "src/bin/log_app.rs"

[[bin]]
name = "log_chinese"
path = "src/bin/log_chinese.rs"

[[bin]]
name = "rbatis_main"
path = "src/bin/rbatis/rbatis_main.rs"

[[bin]]
name = "rbatis_xml_main"
path = "src/bin/rbatis/rbatis_xml_main.rs"

[[bin]]
name = "rbatis_xml_main2"
path = "src/bin/rbatis/rbatis_xml_main2.rs"

[dependencies]
axum = "0.5"
tokio = { version = "1", features = ["full"] }
ammonia = "3.1"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
redis = { version = "0.23", features = ["tokio-comp"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
tower = "0.4.13"
tower-http = { version = "0.3", features = ["cors"] }
config = "0.11"
rbatis = "4.5.33"
rbdc-mysql = "4.5.12" # 如果你使用 MySQL 数据库
rbdc-sqlite = "4.5.12" # 如果你使用 SQLite 数据库
rbdc-pg = "4.5.12" # PostgreSQL 数据库驱动
generic-array = "=1.0.0"
once_cell = "1.19.0"
rbs = "4.5.0"
rand = "0.8"
simplelog = "0.12"
log = "0.4"
hyper = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
config = "0.11"
criterion = "0.5"
toml = "0.8"

[[bench]]
name = "rbatis_bench"
harness = false
