[package]
name = "axum-web-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "log_app"
path = "src/bin/log_app.rs"

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ammonia = "3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
