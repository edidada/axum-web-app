[package]
name = "axum-web-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "threadid_log"
path = "src/bin/threadid_log.rs"

[[bin]]
name = "log_app"
path = "src/bin/log_app.rs"

[[bin]]
name = "log_chinese"
path = "src/bin/log_chinese.rs"

[dependencies]
axum = "0.5"
tokio = { version = "1", features = ["full"] }
ammonia = "3.1"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
redis = { version = "0.23", features = ["tokio-comp"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
tower = "0.4.13"
tower-http = "0.3"
config = "0.11"
rbatis = "=4.4.21"
rbdc-mysql = "=4.4.20" # 如果你使用 MySQL 数据库
generic-array = "=1.0.0"
once_cell = "1.19.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
config = "0.11"