[auth]
username = "edidada"
password = "Pass123Qwe"
role = "admin"

[webapp]
port = 9002

[jwt]
# 生产环境请通过受管密钥覆盖此值，且不要将真实密钥提交到仓库。
secret = "change-this-development-jwt-secret-before-production"
expiration = 900
issuer = "axum-web-app"
audience = "axum-web-frontend"

[security]
# 本地 HTTP 开发为 false；生产 HTTPS 必须覆盖为 true。
cookie_secure = false
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[session]
# 可选 database 或 redis；也可通过 APP_SESSION__BACKEND 覆盖。
backend = "database"
redis_url = "redis://127.0.0.1:6379/0"
redis_key_prefix = "axum:auth_session:"
