<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">
<mapper>
<select id="select_page">
    `select id ,name ,code ,state ,create_date from sys_dict`
    <where>
        <if test="dto.code != null && dto.code != ''">
            ` and code like '%' || #{dto.code} || '%'`
        </if>
        <if test="dto.name != null && dto.name != ''">
            ` and name like '%' || #{dto.name} || '%'`
        </if>
    </where>
    <if test="do_count == false">
        ` order by create_date desc`
    </if>
</select>
    <insert id="insert">
        insert into sys_dict (id, name, code, state, create_date) values (#{id}, #{name}, #{code}, #{state}, #{create_date})
    </insert>
    <update id="update_by_id">
        update sys_dict set name = #{name}, code = #{code}, state = #{state}, create_date = #{create_date} where id = #{id}
    </update>
    <delete id="delete_by_id">
        delete from sys_dict where id = #{id}
    </delete>
    <select id="select_by_id">
        select id, name, code, state, create_date from sys_dict where id = #{id}
    </select>
</mapper>
