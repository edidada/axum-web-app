<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">
<mapper>
<select id="select_page">
    select * from address_book
    <where>
        <if test="dto.user_id != null">
            and user_id = #{dto.user_id}
        </if>
        <if test="dto.consignee != null">
            and consignee = #{dto.consignee}
        </if>
        <if test="dto.phone != null">
            and phone = #{dto.phone}
        </if>
        <if test="dto.label != null">
            and label = #{dto.label}
        </if>
        <if test="dto.is_default != null">
            and is_default = #{dto.is_default}
        </if>
        and is_deleted = 0
    </where>
    <if test="do_count == false">
        order by create_time desc
    </if>
</select>
</mapper>
