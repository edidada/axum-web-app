<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">
<mapper>
<select id="select_page">
    select * from dish
    <where>
        <if test="dto.name != null && dto.name != ''">
            and name like '%' || #{dto.name} || '%'
        </if>
        <if test="dto.category_id != null && dto.category_id != ''">
            and category_id = #{dto.category_id}
        </if>
        <if test="dto.status != null">
            and status = #{dto.status}
        </if>
    </where>
    <if test="do_count == false">
        order by sort
    </if>
</select>
<select id="select_dish_with_flavors">
    select d.*, df.id as flavor_id, df.name as flavor_name, df.value as flavor_value
    from dish d
    left join dish_flavor df on d.id = df.dish_id
    <where>
        <if test="dish_id != null">
            and d.id = #{dish_id}
        </if>
        <if test="name != null">
            and d.name = #{name}
        </if>
    </where>
</select>
</mapper>
