<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">
<mapper>
<select id="select_page">
    select * from setmeal
    <where>
        <if test="dto.name != null">
            and name = #{dto.name}
        </if>
        <if test="dto.category_id != null">
            and category_id = #{dto.category_id}
        </if>
        <if test="dto.status != null">
            and status = #{dto.status}
        </if>
        and is_deleted = 0
    </where>
    <if test="do_count == false">
        order by create_time
    </if>
</select>
<select id="select_setmeal_with_dishes">
    select s.*, sd.id as setmeal_dish_id, sd.dish_id, sd.name as dish_name, sd.price as dish_price, sd.copies, sd.sort
    from setmeal s
    left join setmeal_dish sd on s.id = sd.setmeal_id
    <where>
        <if test="setmeal_id != null">
            and s.id = #{setmeal_id}
        </if>
        <if test="name != null">
            and s.name = #{name}
        </if>
    </where>
</select>
</mapper>
