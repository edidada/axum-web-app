<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">
<mapper>
<select id="select_page">
    select * from orders
    <where>
        <if test="dto.number != null && dto.number != ''">
            and number like '%' || #{dto.number} || '%'
        </if>
        <if test="dto.status != null">
            and status = #{dto.status}
        </if>
        <if test="dto.user_id != null && dto.user_id != ''">
            and user_id = #{dto.user_id}
        </if>
        <if test="dto.pay_status != null">
            and pay_status = #{dto.pay_status}
        </if>
    </where>
    <if test="do_count == false">
        order by order_time desc
    </if>
</select>
<select id="select_order_with_details">
    select o.*, od.id as detail_id, od.name as detail_name, od.image as detail_image, od.dish_id, od.setmeal_id, od.dish_flavor, od.number as detail_number, od.amount as detail_amount
    from orders o
    left join order_detail od on o.id = od.order_id
    <where>
        <if test="order_id != null">
            and o.id = #{order_id}
        </if>
        <if test="user_id != null">
            and o.user_id = #{user_id}
        </if>
    </where>
</select>
</mapper>
