<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axum Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-right: 20px;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        
        .login-form {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .content {
            margin-top: 20px;
        }
        
        .api-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .api-section h3 {
            margin-bottom: 15px;
            color: #4CAF50;
        }
        
        .response {
            margin-top: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <h1>Axum Web App</h1>
                <ul id="nav-menu">
                    <li><a href="#" id="login-link">登录</a></li>
                    <li><a href="#" id="logout-link" class="hidden">登出</a></li>
                    <li><a href="#" id="sys-dict-link" class="hidden">字典管理</a></li>
                    <li><a href="#" id="address-book-link" class="hidden">地址簿</a></li>
                    <li><a href="#" id="category-link" class="hidden">分类管理</a></li>
                    <li><a href="#" id="dish-link" class="hidden">菜品管理</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <div class="container">
        <!-- 登录表单 -->
        <div id="login-section" class="login-form">
            <h2>登录</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码">
            </div>
            <button id="login-btn">登录</button>
            <div id="login-message" class="response"></div>
        </div>
        
        <!-- 内容区域 -->
        <div id="content-section" class="hidden">
            <!-- 字典管理 -->
            <div id="sys-dict-section" class="api-section hidden">
                <h3>字典管理</h3>
                <button id="get-sys-dict-btn">获取字典列表</button>
                <div id="sys-dict-response" class="response"></div>
            </div>
            
            <!-- 地址簿 -->
            <div id="address-book-section" class="api-section hidden">
                <h3>地址簿</h3>
                <button id="get-address-book-btn">获取地址簿列表</button>
                <div id="address-book-response" class="response"></div>
            </div>
            
            <!-- 分类管理 -->
            <div id="category-section" class="api-section hidden">
                <h3>分类管理</h3>
                <button id="get-category-btn">获取分类列表</button>
                <div id="category-response" class="response"></div>
            </div>
            
            <!-- 菜品管理 -->
            <div id="dish-section" class="api-section hidden">
                <h3>菜品管理</h3>
                <button id="get-dish-btn">获取菜品列表</button>
                <div id="dish-response" class="response"></div>
            </div>
        </div>
    </div>
    
    <script>
        // API 基础 URL
        const API_BASE_URL = 'http://localhost:9001';
        
        // DOM 元素
        const loginSection = document.getElementById('login-section');
        const contentSection = document.getElementById('content-section');
        const navMenu = document.getElementById('nav-menu');
        const loginLink = document.getElementById('login-link');
        const logoutLink = document.getElementById('logout-link');
        const sysDictLink = document.getElementById('sys-dict-link');
        const addressBookLink = document.getElementById('address-book-link');
        const categoryLink = document.getElementById('category-link');
        const dishLink = document.getElementById('dish-link');
        
        const loginBtn = document.getElementById('login-btn');
        const loginMessage = document.getElementById('login-message');
        
        const sysDictSection = document.getElementById('sys-dict-section');
        const addressBookSection = document.getElementById('address-book-section');
        const categorySection = document.getElementById('category-section');
        const dishSection = document.getElementById('dish-section');
        
        const getSysDictBtn = document.getElementById('get-sys-dict-btn');
        const getAddressBookBtn = document.getElementById('get-address-book-btn');
        const getCategoryBtn = document.getElementById('get-category-btn');
        const getDishBtn = document.getElementById('get-dish-btn');
        
        const sysDictResponse = document.getElementById('sys-dict-response');
        const addressBookResponse = document.getElementById('address-book-response');
        const categoryResponse = document.getElementById('category-response');
        const dishResponse = document.getElementById('dish-response');
        
        // 检查登录状态
        function checkLoginStatus() {
            // 检查是否有 session cookie
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'session' && value) {
                    showContent();
                    return;
                }
            }
            showLogin();
        }
        
        // 显示登录表单
        function showLogin() {
            loginSection.classList.remove('hidden');
            contentSection.classList.add('hidden');
            loginLink.classList.remove('hidden');
            logoutLink.classList.add('hidden');
            sysDictLink.classList.add('hidden');
            addressBookLink.classList.add('hidden');
            categoryLink.classList.add('hidden');
            dishLink.classList.add('hidden');
        }
        
        // 显示内容区域
        function showContent() {
            loginSection.classList.add('hidden');
            contentSection.classList.remove('hidden');
            loginLink.classList.add('hidden');
            logoutLink.classList.remove('hidden');
            sysDictLink.classList.remove('hidden');
            addressBookLink.classList.remove('hidden');
            categoryLink.classList.remove('hidden');
            dishLink.classList.remove('hidden');
        }
        
        // 显示特定的 API 区域
        function showApiSection(sectionId) {
            // 隐藏所有 API 区域
            sysDictSection.classList.add('hidden');
            addressBookSection.classList.add('hidden');
            categorySection.classList.add('hidden');
            dishSection.classList.add('hidden');
            
            // 显示指定的 API 区域
            document.getElementById(sectionId).classList.remove('hidden');
        }
        
        // 登录处理
        loginBtn.addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                loginMessage.textContent = JSON.stringify(data, null, 2);
                
                if (data.code === 0) {
                    // 登录成功，刷新页面以更新状态
                    window.location.reload();
                }
            } catch (error) {
                loginMessage.textContent = `错误: ${error.message}`;
            }
        });
        
        // 登出处理
        logoutLink.addEventListener('click', async function(e) {
            e.preventDefault();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/logout`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                console.log('登出响应:', data);
                
                // 登出成功，刷新页面以更新状态
                window.location.reload();
            } catch (error) {
                console.error('登出错误:', error);
            }
        });
        
        // 导航链接处理
        loginLink.addEventListener('click', function(e) {
            e.preventDefault();
            showLogin();
        });
        
        sysDictLink.addEventListener('click', function(e) {
            e.preventDefault();
            showApiSection('sys-dict-section');
        });
        
        addressBookLink.addEventListener('click', function(e) {
            e.preventDefault();
            showApiSection('address-book-section');
        });
        
        categoryLink.addEventListener('click', function(e) {
            e.preventDefault();
            showApiSection('category-section');
        });
        
        dishLink.addEventListener('click', function(e) {
            e.preventDefault();
            showApiSection('dish-section');
        });
        
        // API 调用处理
        getSysDictBtn.addEventListener('click', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/sys-dict/list`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                sysDictResponse.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                sysDictResponse.textContent = `错误: ${error.message}`;
            }
        });
        
        getAddressBookBtn.addEventListener('click', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/address-book/select-page`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ page_no: 1, page_size: 10 })
                });
                
                const data = await response.json();
                addressBookResponse.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                addressBookResponse.textContent = `错误: ${error.message}`;
            }
        });
        
        getCategoryBtn.addEventListener('click', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/category/select-page`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ page_no: 1, page_size: 10 })
                });
                
                const data = await response.json();
                categoryResponse.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                categoryResponse.textContent = `错误: ${error.message}`;
            }
        });
        
        getDishBtn.addEventListener('click', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/dish/select-page`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ page_no: 1, page_size: 10 })
                });
                
                const data = await response.json();
                dishResponse.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                dishResponse.textContent = `错误: ${error.message}`;
            }
        });
        
        // 初始化检查登录状态
        checkLoginStatus();
    </script>
</body>
</html>
